{% extends "admin/change_form.html" %}

{% block after_field_sets %}
  <div class="module" style="margin-top:18px">
    <h2 style="padding:8px 10px;background:#417690;color:#fff">Configuration check</h2>
    <div style="padding:12px">
      <p style="margin:0 0 10px;color:#666;font-size:12px">
        These are the values the system is currently using. Anything left blank
        above falls back to <code>settings.py</code> / the environment.
      </p>
      {{ original.configuration_report }}
    </div>
  </div>
{% endblock %}
